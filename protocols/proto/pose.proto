syntax = "proto3";

import "header.proto";
import "quaternion.proto";
import "vector3.proto";

package genisys.protocols;

message Pose {
  aimrt.protocols.geometry.Quaternion orientation = 1;
  aimrt.protocols.geometry.Vector3 position = 2;
}


message PoseStamped {
  aimrt.protocols.common.Header header = 1;
  Pose pose = 2;
}