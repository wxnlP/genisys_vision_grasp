aimrt:
  configurator:
    temp_cfg_path: ./.log/cfg/tmp
  log:
    core_lvl: INFO # Trace/Debug/Info/Warn/Error/Fatal/Off
    backends:
      - type: console
      - type: rotate_file
        options:
          path: ./.log
          filename: error_analysis.log
          max_file_size_m: 4
          max_file_num: 10
  executor:
    executors:
      - name: work_thread_pool
        type: asio_thread
        options:
          thread_num: 2
  module:
    modules:
      - name: VisionGraspModule
        log_lvl: INFO
  plugin:
    plugins:
      - name: net_plugin
        path: ${AIMRT_PLUGIN_DIR}/libaimrt_net_plugin.so
        options:
          thread_num: 2
          http_options:
            listen_ip: 0.0.0.0
            listen_port: 18080
      - name: zenoh_plugin
        path: ${AIMRT_PLUGIN_DIR}/libaimrt_zenoh_plugin.so
        options:
          native_cfg_path: ${AIMRT_SH_DIR}/cfg/zenoh_native_config.json5

  rpc:
    backends:
      - type: http
      - type: zenoh
        options:
          timeout_executor: work_thread_pool
          clients_options:
            - func_name: "(.*)"
              shm_enabled: false
          servers_options:
            - func_name: "(.*)"
              shm_enabled: false
    clients_options:
      - func_name: "(.*)"
        enable_backends: [zenoh]
    servers_options:
      - func_name: "(.*)"
        enable_backends: [zenoh, http]

  channel:
    backends:
      - type: zenoh
    pub_topics_options:
      - topic_name: "(.*)" # 正则表达式
        enable_backends: []
        enable_filters: []
    sub_topics_options:
      - topic_name: "(.*)" # 正则表达式
        enable_backends: [zenoh]
        enable_filters: []

# Module custom configuration
VisionGraspModule:
  work_executor_name: work_thread_pool
  hand_eye_path: ${AIMRT_SH_DIR}/cfg/hand_eye/hand_eye.npz
  camera:
    width: 848
    height: 530
    fps: 30
  yolo_model: ${AIMRT_SH_DIR}/cfg/models/object-block-11n-seg.engine
  snapshot_event: ["graspnet"]
  graspnet:
    gnet_checkpoint: ${AIMRT_SH_DIR}/graspnet_baseline/checkpoint/checkpoint-rs.tar
    target_margin_px: 12
    target_expand_ratio: 1.35
    max_grasp_width_m: 0.09
    roi_expand_ratio: 1.35
    roi_margin_px: 20
